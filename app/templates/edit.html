{% extends "base.html" %}

{% block title %}Edit Task - {{ todo.title }}{% endblock %}

{% block content %}
<div style="max-width: 600px;">
    <a href="{{ url_for('main.view_todo', todo_id=todo.id) }}" class="back-link">← Back</a>

    <div class="card" style="padding: 2rem;">
        <h2 style="font-size: 1.5rem; font-weight: 600; margin-bottom: 1.5rem;">Edit task</h2>

        <form method="POST" style="display: flex; flex-direction: column; gap: 1.25rem;">
            <div>
                <label for="title" class="form-label">Title <span style="color: var(--danger);">*</span></label>
                <input type="text" class="form-control form-control-lg" id="title" name="title" 
                       value="{{ todo.title }}" placeholder="What do you need to do?" required autofocus
                       style="padding: 0.75rem; font-size: 1rem;">
            </div>

            <div>
                <label for="description" class="form-label">Description</label>
                <textarea class="form-control" id="description" name="description" rows="4"
                          placeholder="Add more details about this task (optional)"
                          style="padding: 0.75rem; font-size: 1rem;">{{ todo.description or '' }}</textarea>
            </div>

            <div>
                <label for="due_date" class="form-label">Due Date</label>
                <input type="date" class="form-control" id="due_date" name="due_date"
                       value="{% if todo.due_date %}{{ todo.due_date.strftime('%Y-%m-%d') }}{% endif %}"
                       style="padding: 0.75rem; font-size: 1rem;">
            </div>

            <div>
                <label for="tags" class="form-label">Tags (comma-separated)</label>
                <input type="text" class="form-control" id="tags" name="tags" value="{{ todo.tags or '' }}" placeholder="e.g. work,urgent"
                       style="padding: 0.75rem; font-size: 1rem;">
            </div>

            <div>
                <label for="priority" class="form-label">Priority</label>
                <select id="priority" name="priority" class="form-control" style="padding: 0.75rem; font-size: 1rem;">
                    <option value="0" {% if todo.priority == 0 %}selected{% endif %}>Low</option>
                    <option value="1" {% if todo.priority == 1 %}selected{% endif %}>Medium</option>
                    <option value="2" {% if todo.priority == 2 %}selected{% endif %}>High</option>
                </select>
            </div>

            <div>
                <label for="estimated_minutes" class="form-label">Estimated time (minutes)</label>
                <input type="number" class="form-control" id="estimated_minutes" name="estimated_minutes" min="0"
                       value="{{ todo.estimated_minutes or '' }}" placeholder="e.g. 30" style="padding: 0.75rem; font-size: 1rem;">
            </div>

            <div>
                <label for="notes" class="form-label">Notes</label>
                <textarea class="form-control" id="notes" name="notes" rows="3" placeholder="Optional notes"
                          style="padding: 0.75rem; font-size: 1rem;">{{ todo.notes or '' }}</textarea>
            </div>

            <div>
                <label for="created_by" class="form-label">Created by</label>
                <input type="text" class="form-control" id="created_by" name="created_by" value="{{ todo.created_by or '' }}" placeholder="Your name"
                       style="padding: 0.75rem; font-size: 1rem;">
            </div>

            <div>
                <label for="recurrence_type" class="form-label">Recurrence</label>
                <select id="recurrence_type" name="recurrence_type" class="form-control" style="padding: 0.5rem;">
                    <option value="" {% if not todo.is_recurring %}selected{% endif %}>None</option>
                    <option value="daily" {% if todo.recurrence_type == 'daily' %}selected{% endif %}>Daily</option>
                    <option value="weekly" {% if todo.recurrence_type == 'weekly' %}selected{% endif %}>Weekly</option>
                    <option value="monthly" {% if todo.recurrence_type == 'monthly' %}selected{% endif %}>Monthly</option>
                </select>
            </div>

            <div>
                <label for="recurrence_interval" class="form-label">Interval</label>
                <input type="number" class="form-control" id="recurrence_interval" name="recurrence_interval" value="{{ todo.recurrence_interval or 1 }}" min="1" style="padding: 0.75rem; font-size: 1rem;">
            </div>

            <div>
                <label for="recurrence_end_date" class="form-label">Recurrence End</label>
                <input type="date" class="form-control" id="recurrence_end_date" name="recurrence_end_date" value="{% if todo.recurrence_end_date %}{{ todo.recurrence_end_date.strftime('%Y-%m-%d') }}{% endif %}" style="padding: 0.75rem; font-size: 1rem;">
            </div>

            <div style="display: flex; gap: 0.75rem; margin-top: 1rem;">
                <button type="submit" class="btn btn-primary" style="padding: 0.75rem 1.5rem; font-size: 1rem;">Save Changes</button>
                <a href="{{ url_for('main.view_todo', todo_id=todo.id) }}" class="btn btn-ghost" style="padding: 0.75rem 1.5rem; font-size: 1rem;">Cancel</a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
